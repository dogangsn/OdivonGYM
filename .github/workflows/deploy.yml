name: Deploy panel to Cloudflare

# Every push to master is tested, built and published to the Cloudflare Worker
# "odivon-gym-client" (static assets, see wrangler.jsonc). Firebase Hosting is not
# deployed by CI.
on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-panel
  cancel-in-progress: false

jobs:
  deploy:
    name: Test, build & deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npx ng test --watch=false --browsers=ChromeHeadless

      # Same build as `npm run deploy:cf` (prebuild writes version.json and the build identity).
      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
