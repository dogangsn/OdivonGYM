name: Deploy to Firebase on Push

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build & Deploy to Firebase
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: odivongym
          workload_identity_provider: projects/560162164944/locations/global/workloadIdentityPools/github-odivongym/providers/github-master
          service_account: github-firebase-deploy@odivongym.iam.gserviceaccount.com
          token_format: access_token

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build

      - name: Install Cloud Functions Dependencies
        run: npm --prefix functions ci

      - name: Build Cloud Functions
        run: npm --prefix functions run build

      - name: Deploy to Firebase
        run: npx --yes firebase-tools@latest deploy --non-interactive --project odivongym
