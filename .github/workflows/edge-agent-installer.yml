name: Edge Agent kurulum

# edge-agent değişince Windows kurulum dosyasını üretir ve "edge-agent-latest" GitHub
# Release'ine sabit adla yükler; panel indirme düğmesi bu adrese bağlıdır:
# https://github.com/dogangsn/OdivonGYM/releases/download/edge-agent-latest/OdivonEdgeAgentKurulum.exe
# Panel yayınını etkilemez.
on:
  push:
    branches:
      - master
    paths:
      - 'edge-agent/**'
      - 'scripts/build-edge-agent-installer.ps1'
      - '.github/workflows/edge-agent-installer.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testler
        working-directory: edge-agent
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Kurulum dosyası
        run: ./scripts/build-edge-agent-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: OdivonEdgeAgentKurulum
          path: edge-agent/dist/*.exe
          retention-days: 30

      # Sabit adres: release etiketi ve dosya adı değişmez, her derlemede dosya yenilenir.
      - name: Release (edge-agent-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'edge-agent-latest'
          $version = (Get-Content edge-agent/package.json -Raw | ConvertFrom-Json).version
          $exe = Get-ChildItem edge-agent/dist/*.exe | Select-Object -First 1
          if (-not $exe) { throw 'Kurulum dosyası bulunamadı.' }
          $fixed = Join-Path $exe.DirectoryName 'OdivonEdgeAgentKurulum.exe'
          Copy-Item $exe.FullName $fixed -Force
          $notes = "OdivonGYM Edge Agent v$version kurulum dosyası (commit $env:GITHUB_SHA). Panelden indirilir."
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title 'Edge Agent kurulum (son sürüm)' --notes $notes --latest=false
            if ($LASTEXITCODE -ne 0) { throw "Release oluşturulamadı: $LASTEXITCODE" }
          } else {
            gh release edit $tag --notes $notes
          }
          gh release upload $tag $fixed $exe.FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw "Release yüklemesi başarısız: $LASTEXITCODE" }
