<app-page-header
  title="E-Cüzdan"
  icon="account_balance_wallet"
  description="Otomat, market ve ek ders satın alımlarında kullanılan bakiyeni yönet."
/>

<section class="balance-card">
  <p class="balance-card__label">E-Cüzdan Bakiyesi</p>
  <p class="balance-card__value">₺{{ balanceLabel() }}</p>
  <p class="balance-card__hint">Salon içi otomat ve market alışverişlerinde kullanılır.</p>
</section>

<section class="top-up">
  <h2>Bakiye Yükle</h2>
  <div class="top-up__grid">
    @for (amount of amounts; track amount) {
      <button type="button" class="top-up__btn" (click)="requestTopUp(amount)">₺{{ amount }}</button>
    }
  </div>
</section>

<app-coming-soon
  icon="receipt_long"
  title="İşlem geçmişi yakında burada"
  description="Bakiye yüklemelerin, otomat ve market alışverişlerinin dökümü burada listelenecek."
/>
