<router-outlet />

<!-- 1. Giriş / oturum açılışı (kullanıcı oturum açmışken): tam ekran yükleme sahnesi.
     Oturum yoksa (ör. giriş sayfası açılırken) küçük yükleyici yeterli. -->
@if (!auth.ready()) {
  @if (auth.user() || booted()) {
    <app-loading-stage message="Oturum açılıyor…" submessage="Salon verilerin hazırlanıyor" />
  } @else {
    <app-gym-busy message="Hazırlanıyor…" />
  }
}

<!-- 2. Sayfalar arası veri yüklemeleri: spor ikonlu küçük modal -->
@if (httpLoading.isLoading() && auth.ready()) {
  <app-gym-busy [message]="httpLoading.message()" />
}

<!-- 3. Yeni sürüm bildirimi -->
<app-update-banner />

<!-- 4. KVKK & Çerez İzin Yönetimi -->
<app-cookie-consent-banner />

<!-- 5. Güvenli Ekran Kilit Ekranı (PIN) -->
@if (auth.user() && lockService.isLocked()) {
  <app-lock-screen />
}

<!-- 6. PIN Ayar / Değiştirme Modalı -->
<app-lock-setup-modal />
