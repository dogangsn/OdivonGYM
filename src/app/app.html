<router-outlet />

<!-- 1. Sistem Başlatma / Auth Hazır Değilken Gösterilen Yükleyici -->
@if (!auth.ready()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 transition-opacity select-none"
    aria-busy="true"
  >
    <!-- Şık Karanlık Cam (Glassmorphism) HUD Modal -->
    <div class="relative overflow-hidden rounded-3xl bg-slate-900/85 backdrop-blur-2xl border border-slate-700/60 shadow-[0_25px_60px_-15px_rgba(0,0,0,0.85),0_0_50px_rgba(99,102,241,0.25)] p-6 sm:p-8 max-w-sm w-[92%] sm:w-auto mx-4 animate-in zoom-in-95 duration-200">
      <div class="absolute -top-16 -left-16 w-36 h-36 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-16 -right-16 w-36 h-36 bg-pink-500/15 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute inset-0 bg-gradient-to-b from-white/[0.04] to-transparent pointer-events-none rounded-3xl"></div>

      <app-gym-loader message="Sistem Hazırlanıyor…" submessage="OdivonGYM Güvenli Oturum Açılıyor" size="lg" />
    </div>
  </div>
}

<!-- 2. Global API İstekleri / Veri Yüklenirken Gösterilen Spor Aletleri Loader'ı -->
@if (httpLoading.isLoading()) {
  <div
    class="fixed inset-0 z-[9999] flex items-center justify-center bg-slate-950/70 dark:bg-black/80 backdrop-blur-sm transition-all duration-300 animate-in fade-in select-none"
    role="status"
    aria-live="polite"
    aria-busy="true"
  >
    <!-- Kesinlikle Beyazlık Olmayan, Şık ve Modern Karanlık Cam HUD Tasarımı -->
    <div class="relative overflow-hidden rounded-3xl bg-slate-900/90 dark:bg-slate-950/95 backdrop-blur-2xl border border-slate-700/70 dark:border-slate-800 shadow-[0_25px_60px_-15px_rgba(0,0,0,0.85),0_0_50px_rgba(99,102,241,0.3)] p-6 sm:p-8 max-w-sm w-[92%] sm:w-auto mx-4 animate-in zoom-in-95 duration-200">
      <!-- Neon Işık Parıltıları -->
      <div class="absolute -top-14 -left-14 w-36 h-36 bg-indigo-500/25 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-14 -right-14 w-36 h-36 bg-pink-500/20 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute inset-0 bg-gradient-to-b from-white/[0.05] to-transparent pointer-events-none rounded-3xl"></div>

      <app-gym-loader [message]="httpLoading.message()" size="md" />
    </div>
  </div>
}
