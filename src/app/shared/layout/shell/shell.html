<div class="shell">
  <app-sidebar
    [collapsed]="collapsed()"
    [mobileOpen]="mobileOpen()"
    (collapseToggle)="toggleCollapse()"
    (closeMobile)="closeMobileNav()"
    (logOutRequested)="logOut()"
  />

  @if (mobileOpen()) {
    <button type="button" class="backdrop" [attr.aria-label]="'sidebar.closeMenu' | transloco" (click)="closeMobileNav()"></button>
  }

  <div class="shell__body">
    <header class="topbar">
      <button
        type="button"
        class="topbar__icon-btn topbar__menu-btn"
        (click)="openMobileNav()"
        [attr.aria-label]="'shell.openMenu' | transloco"
      >
        <mat-icon>menu</mat-icon>
      </button>

      <label class="topbar__search">
        <mat-icon>search</mat-icon>
        <input type="text" [placeholder]="'shell.searchPlaceholder' | transloco" />
      </label>

      <div class="topbar__spacer"></div>

      <button type="button" class="topbar__icon-btn" [matTooltip]="'shell.language' | transloco" [matMenuTriggerFor]="langMenu">
        <mat-icon>language</mat-icon>
      </button>
      <mat-menu #langMenu="matMenu">
        @for (lang of languages; track lang) {
          <button mat-menu-item (click)="setLanguage(lang)" [class.active-lang]="language.current() === lang">
            {{ languageNames[lang] }}
          </button>
        }
      </mat-menu>

      <button type="button" class="topbar__icon-btn" [matTooltip]="'shell.notifications' | transloco">
        <mat-icon>notifications</mat-icon>
        <span class="topbar__dot" aria-hidden="true"></span>
      </button>

      <button
        type="button"
        class="topbar__icon-btn"
        (click)="theme.toggle()"
        [matTooltip]="(theme.mode() === 'dark' ? 'shell.lightTheme' : 'shell.darkTheme') | transloco"
      >
        <mat-icon>{{ theme.mode() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
